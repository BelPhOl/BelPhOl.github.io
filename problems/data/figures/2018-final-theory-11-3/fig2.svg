<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="none">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e293b"/>
    </marker>
    <marker id="arr2a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
  </defs>
  <!-- Sun -->
  <circle cx="52" cy="100" r="34" fill="url(#sun)" stroke="#d97706" stroke-width="1.5"/>
  <g stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round">
    <line x1="52" y1="52" x2="52" y2="40"/><line x1="52" y1="148" x2="52" y2="160"/>
    <line x1="100" y1="100" x2="112" y2="100"/><line x1="4" y1="100" x2="-2" y2="100"/>
    <line x1="86" y1="66" x2="95" y2="57"/><line x1="86" y1="134" x2="95" y2="143"/>
    <line x1="18" y1="66" x2="9" y2="57"/><line x1="18" y1="134" x2="9" y2="143"/>
  </g>
  <!-- radiation wiggle toward the particle -->
  <path d="M 100 88 q 10 -8 20 0 t 20 0 t 20 0 t 20 0" stroke="#f59e0b" stroke-width="1.6"/>
  <path d="M 100 112 q 10 8 20 0 t 20 0 t 20 0 t 20 0" stroke="#f59e0b" stroke-width="1.6"/>
  <!-- dust particle -->
  <circle cx="232" cy="100" r="11" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
  <text x="222" y="76" fill="#334155" font-style="italic">r</text>
  <line x1="232" y1="100" x2="240.5" y2="93" stroke="#e2e8f0" stroke-width="1.3"/>
  <!-- forces -->
  <line x1="245" y1="100" x2="305" y2="100" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#arr2a)"/>
  <line x1="219" y1="100" x2="150" y2="100" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr2)"/>
  <text x="256" y="84" fill="#b45309" font-style="italic">F<tspan baseline-shift="sub" font-size="11">&#1089;&#1074;</tspan></text>
  <text x="152" y="84" fill="#1e293b" font-style="italic">F<tspan baseline-shift="sub" font-size="11">&#1075;&#1088;</tspan></text>
  <!-- distance R -->
  <line x1="52" y1="176" x2="232" y2="176" stroke="#94a3b8" stroke-width="1.3" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="136" y="194" fill="#475569" font-style="italic">R</text>
</svg>
